services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\SeoKitBundle\Service\SeoRuntime:
        shared: true

    Nowo\SeoKitBundle\Service\SeoTemplateRenderer: ~

    Nowo\SeoKitBundle\Service\SeoPathBuilder:
        arguments:
            $config: '%nowo_seo_kit.config%'

    Nowo\SeoKitBundle\Service\SeoPathBuilderInterface:
        alias: Nowo\SeoKitBundle\Service\SeoPathBuilder

    Nowo\SeoKitBundle\Service\SeoMetadataResolver:
        arguments:
            $config: '%nowo_seo_kit.config%'
            $defaultsProviders: !tagged_iterator nowo_seo_kit.defaults_provider
            # Spec 220 S6: registered by SeoKitExtension only with brand.mode auto and nowo-tech/brand-contracts installed.
            $brand: '@?Nowo\SeoKitBundle\Brand\SeoKitBrand'

    Nowo\SeoKitBundle\Service\SitemapGenerator:
        arguments:
            $config: '%nowo_seo_kit.config%'
            $urlProviders: !tagged_iterator nowo_seo_kit.sitemap_url_provider
            $indexabilityProviders: !tagged_iterator nowo_seo_kit.indexability_provider

    Nowo\SeoKitBundle\Service\RobotsTxtGenerator:
        arguments:
            $config: '%nowo_seo_kit.config%'
            $indexabilityProviders: !tagged_iterator nowo_seo_kit.indexability_provider
            $geoRobotsGroupsProviders: !tagged_iterator nowo_seo_kit.geo_robots_groups_provider

    Nowo\SeoKitBundle\Controller\SeoKitController:
        arguments:
            $config: '%nowo_seo_kit.config%'
        tags: ['controller.service_arguments']
        public: true

    Nowo\SeoKitBundle\Twig\SeoKitExtension:
        arguments:
            $enabled: '%nowo_seo_kit.enabled%'
            $templates: '%nowo_seo_kit.templates%'
        tags: ['twig.extension']

    # Only already-built services are cleared at a boundary ('@!' = IGNORE_ON_UNINITIALIZED_REFERENCE): nothing is
    # built per request, Messenger message or console command.
    Nowo\SeoKitBundle\EventSubscriber\SeoRuntimeClearSubscriber:
        arguments:
            $runtime: null
            $pageHeadContext: null
            $siteConfigProvider: null
            $resettables: !iterator
                - '@!Nowo\SeoKitBundle\Service\SeoRuntime'
                - '@!Nowo\SeoKitBundle\Service\PageHeadContext'
                - '@!Nowo\SeoKitBundle\Service\Persistence\SeoSiteConfigProvider'
        tags: ['kernel.event_subscriber']

    Nowo\SeoKitBundle\EventSubscriber\XRobotsTagSubscriber:
        arguments:
            $enabled: '%nowo_seo_kit.x_robots_tag.enabled%'
        tags: ['kernel.event_subscriber']

    Nowo\SeoKitBundle\Routing\SeoStaticRouteLoader:
        arguments:
            $config: '%nowo_seo_kit.config%'
        tags: ['routing.loader']

    Nowo\SeoKitBundle\Service\StructuredData\SiteStructuredDataFactory: ~

    Nowo\SeoKitBundle\Service\OriginUrlGuard: ~

    Nowo\SeoKitBundle\Service\Audit\SeoAuditRules: ~

    Nowo\SeoKitBundle\Service\Audit\SeoAuditor:
        arguments:
            $subjectProviders: !tagged_iterator nowo_seo_kit.audit_subject_provider
