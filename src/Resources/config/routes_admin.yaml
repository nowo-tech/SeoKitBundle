# DEPRECATED since 1.14.0, will be removed in 2.0.
# Importing these attribute routes registers every admin/API controller and ignores
# nowo_seo_kit.admin.{enabled,settings,surfaces,api_enabled}. Import the bundle loader instead:
#
#   nowo_seo_kit_admin:
#       resource: .
#       type: nowo_seo_kit_admin

nowo_seo_kit_admin_controllers:
    resource: ../../Controller/Admin/
    type: attribute

nowo_seo_kit_api_controllers:
    resource: ../../Controller/Api/
    type: attribute
