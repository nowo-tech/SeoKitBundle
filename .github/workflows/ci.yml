name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          # Symfony 8 requires PHP >= 8.4.
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zip
          coverage: pcov
          tools: composer:v2

      - run: composer validate --strict

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies
        run: |
          composer require \
            symfony/config:^${{ matrix.symfony }} \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/form:^${{ matrix.symfony }} \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            symfony/http-foundation:^${{ matrix.symfony }} \
            symfony/http-kernel:^${{ matrix.symfony }} \
            symfony/routing:^${{ matrix.symfony }} \
            symfony/translation:^${{ matrix.symfony }} \
            symfony/twig-bundle:^${{ matrix.symfony }} \
            symfony/validator:^${{ matrix.symfony }} \
            symfony/yaml:^${{ matrix.symfony }} \
            --no-interaction --no-update
          composer require --dev \
            symfony/browser-kit:^${{ matrix.symfony }} \
            symfony/messenger:^${{ matrix.symfony }} \
            symfony/phpunit-bridge:^${{ matrix.symfony }} \
            --no-interaction --no-update
          composer update --no-interaction --prefer-dist
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - run: composer test
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0  # REQ-SF-005

      - if: matrix.php == '8.2' && matrix.symfony == '7.4'
        run: composer test-coverage
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0  # REQ-SF-005

  # REQ-CS-006: code style, PHPStan, Twig/translation gates on every push and PR.
  cs-check:
    name: Code style + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer cs-check
      - name: PHPStan
        run: composer phpstan
      - name: Raw HTML form gate (REQ-TWIG-005)
        run: ./.scripts/check-no-raw-html-form.sh
      - name: Translation key parity (REQ-MAKE-004)
        run: php .scripts/validate-translations.php

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, zip
          coverage: pcov
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist
      - name: Run tests with coverage
        run: |
          composer test-coverage
          METRICS_LINE=$(grep '<metrics files=' coverage.xml)
          STATEMENTS=$(echo "$METRICS_LINE" | awk -F'statements="' '{print $2}' | awk -F'"' '{print $1}')
          COVERED=$(echo "$METRICS_LINE" | awk -F'coveredstatements="' '{print $2}' | awk -F'"' '{print $1}')
          COVERAGE_PERCENT=$(echo "scale=2; ($COVERED / $STATEMENTS) * 100" | bc | cut -d. -f1)
          echo "Code coverage: ${COVERAGE_PERCENT}%"
          MIN_COVERAGE=100
          if [ "$COVERAGE_PERCENT" -lt "$MIN_COVERAGE" ]; then
            echo "ERROR: Code coverage is ${COVERAGE_PERCENT}%, expected at least ${MIN_COVERAGE}%"
            exit 1
          fi

# Maintainer: Héctor Franco Aceituno (@HecFranco)
# Organization: nowo-tech (https://github.com/nowo-tech)

  # 1.25 (REQ-RUNTIME-003): real-database races on MySQL 8.4, MariaDB 11.4 and PostgreSQL 16, with doctrine/dbal 4 and 3.
  # Two connections per test; every session sets a short lock timeout, so a hang fails fast instead of holding the job.
  databases:
    name: Real databases (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MySQL 8.4', url: 'mysql://root@127.0.0.1:3306/seo_kit?serverVersion=8.4.0&charset=utf8mb4', dbal: '' }
          - { name: 'MariaDB 11.4', url: 'mysql://root@127.0.0.1:3307/seo_kit?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '' }
          - { name: 'PostgreSQL 16', url: 'postgresql://postgres@127.0.0.1:5432/seo_kit?serverVersion=16&charset=utf8', dbal: '' }
          - { name: 'MySQL 8.4, DBAL 3', url: 'mysql://root@127.0.0.1:3306/seo_kit?serverVersion=8.4.0&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'MariaDB 11.4, DBAL 3', url: 'mysql://root@127.0.0.1:3307/seo_kit?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'PostgreSQL 16, DBAL 3', url: 'postgresql://postgres@127.0.0.1:5432/seo_kit?serverVersion=16&charset=utf8', dbal: '^3.8.2' }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: seo_kit
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: seo_kit
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: seo_kit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies (from the lock)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Use DBAL 3
        if: ${{ matrix.dbal != '' }}
        run: |
          composer require --no-interaction --no-progress --with-all-dependencies "doctrine/dbal:${{ matrix.dbal }}"
          composer show doctrine/dbal | head -4

      - name: Two-connection race tests
        timeout-minutes: 10
        env:
          SEO_KIT_TEST_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped --testsuite database

      - name: Unit and integration suites on this doctrine/dbal
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage --testsuite unit,integration

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/seo-kit-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and the demo
  # fails with "class not found").
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies from the lock (only nowo-tech/transaction-* move below)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Unit and integration suites at the floor
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage --testsuite unit,integration

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor
